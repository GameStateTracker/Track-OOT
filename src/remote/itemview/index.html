<!DOCTYPE html>
<html>

<head>
    <title>[D]Track-OOT</title>
    <meta charset="UTF-8">
    <meta name="description" content="Track items and locations in 'The Legend of Zelda - Ocarina of Time Randomizer' (OOTR)">
    <meta name="robots" content="norobots, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#cb9c3d">
    <script type="importmap">
    {
        "imports": {
            "@emcjs/core/": "/_libs/emcjs/core/",
            "@emcjs/fe/": "/_libs/emcjs/fe/",
            "rtcclient/": "/_libs/rtcclient/",
            "gametrackerjs/": "/_libs/gametrackerjs/",
            "archipelagojs/": "/_libs/archipelagojs/",
            "jseditors/": "/_libs/jseditors/"
        }
    }
    </script>
    <link rel="icon" type="image/png" sizes="192x192" href="/images/favicons/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicons/icon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/images/favicons/icon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicons/icon-16x16.png">
    <link rel="stylesheet" type="text/css" href="/style/index.css">
    <script>
        window.addEventListener("contextmenu", function () {
            event.preventDefault();
            return false;
        });
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistration("/sw.js").then((cacheControl) => {
                if (cacheControl != null) {
                    cacheControl.unregister();
                }
            });
        }
    </script>
    <script type="module" src="/remote/itemview/index.js"></script>
    <style>
        body {
            margin: 0;
            background-color: var(--page-back-color, #000000);
            font-family: Arial, Helvetica, sans-serif;
        }

        #container {
            display: flex;
            flex-direction: column;
            max-width: 100dvw;
            max-height: 100dvh;
            width: min-content;
            height: min-content;
            z-index: 0;
        }

        #container.fill {
            width: 100dvw;
            height: 100dvh;
            min-width: 600px;
            min-height: 350px;
        }

        #container #layout {
            min-width: 0px;
            min-height: 0px;
        }

        #container.fill #layout>.panel {
            width: 100dvw;
            height: 100dvh;
            min-width: 600px;
            min-height: 350px;
        }

        #info-panel {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #00000033;
            backdrop-filter: blur(2px);
            z-index: 50;
        }

        #info-panel .text {
            padding: 10px;
            color: white;
            background-color: black;
            font-size: 2em;
            font-weight: bold;
            white-space: pre;
        }

        .size-panel {
            position: absolute;
            top: 0;
            left: 0;
            padding: 2px;
            color: white;
            background-color: black;
        }

        .click-prevent {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            z-index: 100;
        }

        #location-state {
            display: inline;
            text-align: end;
            padding: 0 5px;
            color: var(--navigation-text-color, #000000);
            background-color: var(--navigation-back-color, #ffffff);
            font-weight: bold;
            white-space: nowrap;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div id="container">
        <emc-layout id="layout">
        </emc-layout>
        <div id="location-state" class="hidden">
            <span id="locations-done">#</span> done • <span id="locations-available">#</span> avail • <span id="locations-missing">#</span> miss • <span id="exits-available">#</span> exits
        </div>
    </div>
    <div id="info-panel">
        <div class="text">NOT CONNECTED</div>
        <div class="size-panel">
            <div class="size-panel-line">
                Itemgrid Size:
                <span id="panel-width">0</span>
                x
                <span id="panel-height">0</span>
            </div>
            <div class="size-panel-line">
                Full Size:
                <span id="page-width">0</span>
                x
                <span id="page-height">0</span>
            </div>
        </div>
    </div>
    <div class="click-prevent"></div>
</body>

</html>
