<emc-form-container id="form">
    <form>
        <emc-form-field label="Room name">
            <emc-input-string id="name" name="name"></emc-input-string>
        </emc-form-field>
        <emc-form-field label="Password">
            <emc-input-password id="password" name="password"></emc-input-password>
        </emc-form-field>
        <emc-form-field label="Description">
            <emc-input-text id="description" name="description"></emc-input-text>
        </emc-form-field>
        <emc-form-field label="Clients join as...">
            <emc-select-simple id="client-type" name="clientType"></emc-select-simple>
        </emc-form-field>
    </form>
</emc-form-container>

<emc-button id="cancel" variant="secondary" text="Cancel"></emc-button>
<emc-button id="host" variant="primary" text="Create"></emc-button>
