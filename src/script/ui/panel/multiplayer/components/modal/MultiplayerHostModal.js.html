<emc-form-container id="form">
    <form>
        <emc-input-string id="name" name="name" label="Room name"></emc-input-string>
        <emc-input-password id="password" name="password" label="Password"></emc-input-password>
        <emc-input-text id="description" name="description" label="Description"></emc-input-text>
        <emc-select-simple id="client-type" name="clientType" label="Clients join as..."></emc-select-simple>
    </form>
</emc-form-container>

<emc-button id="cancel" text="Cancel"></emc-button>
<emc-button id="host" text="Create"></emc-button>
