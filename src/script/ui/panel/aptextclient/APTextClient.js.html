<emc-panel-tabpanel id="ap-tabs">
    <div category="ap-log">
        <div class="container">
            <div class="filter-bar">
                <emc-input-search id="ap-log-search" class="search-field" placeholder="Search"></emc-input-search>
                <emc-select-simple id="ap-log-msgtype" class="filter-choice" placeholder="Message Type" chooseonly value="">
                    <option value="" label="Show All Messages"></option>
                    <option value="ItemSend" label="Item Transfers Only"></option>
                </emc-select-simple>
                <emc-select-token id="ap-log-itemclass" class="filter-choice" placeholder="Item Class" chooseonly multiple value="[&quot;progressive&quot;,&quot;useful&quot;,&quot;normal&quot;,&quot;trap&quot;]">
                    <option value="progressive" label="Progressive"></option>
                    <option value="useful" label="Useful"></option>
                    <option value="normal" label="Normal"></option>
                    <option value="trap" label="Trap"></option>
                </emc-select-token>
                <emc-select-token id="ap-log-direction" class="filter-choice" placeholder="Direction" chooseonly multiple value="[&quot;sender&quot;,&quot;receiver&quot;]">
                    <option value="sender" label="Sender"></option>
                    <option value="receiver" label="Receiver"></option>
                </emc-select-token>
            </div>
            <ootrt-ap-chatlist id="ap-log" autoscroll></ootrt-ap-chatlist>
        </div>
    </div>
    <div category="hints">
        <div class="container">
            <div class="filter-bar">
                <emc-input-search id="ap-hints-search" class="search-field" placeholder="Search..."></emc-input-search>
                <emc-select-token id="ap-hints-itemclass" class="filter-choice" placeholder="Item Class" chooseonly multiple value="[&quot;progressive&quot;,&quot;useful&quot;,&quot;normal&quot;,&quot;trap&quot;]">
                    <option value="progressive" label="Progressive"></option>
                    <option value="useful" label="Useful"></option>
                    <option value="normal" label="Normal"></option>
                    <option value="trap" label="Trap"></option>
                </emc-select-token>
                <emc-select-token id="ap-hints-direction" class="filter-choice" placeholder="Direction" chooseonly multiple value="[&quot;finder&quot;,&quot;receiver&quot;]">
                    <option value="finder" label="Finder"></option>
                    <option value="receiver" label="Receiver"></option>
                </emc-select-token>
                <emc-select-token id="ap-hints-status" class="filter-choice" placeholder="Status" chooseonly multiple value="[&quot;found&quot;,&quot;missing&quot;]">
                    <option value="found" label="Found"></option>
                    <option value="missing" label="Not found"></option>
                </emc-select-token>
            </div>
            <emc-datagrid id="ap-hints" stretched="location">
                <emc-datagrid-column name="finder" label="Finder" type="apuser" sortable sortby="finder.alias" width="15%"></emc-datagrid-column>
                <emc-datagrid-column name="item" label="Item" type="apitems" sortable sortby="item.itemName" width="20%"></emc-datagrid-column>
                <emc-datagrid-column name="receiver" label="Receiver" type="apuser" sortable sortby="receiver.alias" width="15%"></emc-datagrid-column>
                <emc-datagrid-column name="location.locationName" label="Location" type="text" sortable width="20%" textColor="var(--ap-color-location, #00ff7f)"></emc-datagrid-column>
                <emc-datagrid-column name="entrance" label="Entrance" type="text" sortable width="20%" textColor="var(--ap-color-entrance, #6495ed)"></emc-datagrid-column>
                <emc-datagrid-column name="status" label="Status" type="apstatus" sortable sortby="status.statusId" width="10%" halign="center"></emc-datagrid-column>
            </emc-datagrid>
        </div>
    </div>
    <div category="hint_builder">
        <div class="container">
            <ootrt-ap-item-hint-builder id="ap-item-hint-builder"></ootrt-ap-item-hint-builder>
        </div>
    </div>
</emc-panel-tabpanel>
<div class="hint-stats">
    Hints available: <span id="ap-hints-available">0</span> | Next hint: <span id="ap-hint-points-next">0</span> / <span id="ap-hint-points-needed">0</span> <progress id="ap-hint-point-progress" value="0" max="0"></progress>
</div>
<emc-form-field subtext="!help for a list of commands - arrow up / arrow down for command history" nohover>
    <emc-input-string id="chat-input" placeholder="Message / Command" autocomplete="off" disabled></emc-input-string>
</emc-form-field>
<!--
    [Hint Location category]
    - search field
    - datalist with 10 entries max to "force" search
    - on location click fill chat with "hint_location" message and wait for user to send
    -> locations in locationlist/-map should also get a "AP hint location" entry for contextmenu
-->
