<emc-form-container id="form">
    <form>
        <emc-input-string id="apHostname" name="apHostname" label="Hostname" value="archipelago.gg"></emc-input-string>
        <emc-input-number id="apPort" name="apPort" label="Port" min="1" max="65535"></emc-input-number>
        <emc-input-string id="apSlotName" name="apSlotName" label="Slot name"></emc-input-string>
        <emc-input-password id="apPassword" name="apPassword" label="Password"></emc-input-password>
        <emc-input-switch id="apSettingsSync" name="apSettingsSync" label="Sync Settings"></emc-input-switch>
    </form>
</emc-form-container>

<emc-button id="purge" text="purge ap state"></emc-button>
<emc-button id="connect" text="connect"></emc-button>
<emc-button id="disconnect" text="disconnect" class="hidden"></emc-button>
<emc-button id="cancel" text="cancel"></emc-button>
