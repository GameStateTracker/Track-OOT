        <option is="emc-i18n-option" value="custom" i18n-value="Custom"></option>
    </emc-select-switch>
    <emc-select-list id="selection" multiple="true">

        <option is="emc-i18n-option" value="reward" i18n-value="dungeonstatetypeactive.reward"></option>
