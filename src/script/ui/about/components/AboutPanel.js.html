<div class="section-block header-block" style="align-items: center;">

        <div class="text-block">
            <div><emc-i18n-label i18n-value="Tracker version"></emc-i18n-label>: </div>
            <span id="tracker-version">[local]</span>
        </div>
        <div class="text-block">
            <div><emc-i18n-label i18n-value="Version date"></emc-i18n-label>: </div>
            <span id="tracker-date">01.01.2019 00:00:00</span>
        </div>
        <div class="text-block">
            <emc-button-link id="current-changelog" text="View the changelog" href="CHANGELOG.MD"></emc-button-link>
        </div>

    <div class="meta-links">
        <emc-button-link text="Join my Discord" href="https://discord.gg/wgFVtuv"></emc-button-link>

    </div>

</div>

    <ootrt-updatehandler id="updatehandler"></ootrt-updatehandler>
</div>
<div class="section-block">
    <div class="text-block">
        <emc-i18n-label i18n-value="Erase all app data"></emc-i18n-label>

    </div>
</div>
<div class="section-block">

        <emc-i18n-textbox i18n-content="about_text_logic"></emc-i18n-textbox>

        <emc-i18n-label i18n-value="You can report via Discord"></emc-i18n-label>
