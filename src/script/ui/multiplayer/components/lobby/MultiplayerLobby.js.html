<div id="lobby-container" class="container">
    <div id="title" class="caption">
        <emc-i18n-label i18n-value="Multiplayer Lobby"></emc-i18n-label>
        <emc-button id="refresh" icon="↻" tooltip="Refresh" class="rotate-icon-90"></emc-button>
        <emc-button id="host" icon-type="font" icon="add" tooltip="Create Room"></emc-button>
    </div>
    <div id="content">
        <slot id="lobby-list">
            <div class="empty-message">No rooms found.<br>Please press refresh!</div>
        </slot>
    </div>
</div>
<div id="room-details-container" class="container">
    <div id="room-details-caption" class="caption">
        <emc-i18n-label i18n-value="Room details"></emc-i18n-label>
    </div>
    <ootrt-multiplayer-lobby-room-details id="room-details"></ootrt-multiplayer-lobby-room-details>
</div>
