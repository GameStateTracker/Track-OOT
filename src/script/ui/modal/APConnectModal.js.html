<emc-form-container id="form">
    <form>
        <p class="form-text">This connects and syncs with the OOT game of Archipelago.<br>SoH is not supported!</p>
        <emc-form-field label="Hostname" subtext="ap.hostname.subtext">
            <emc-input-string id="apHostname" name="apHostname" value="archipelago.gg"></emc-input-string>
        </emc-form-field>
        <emc-form-field label="Port">
            <emc-input-number id="apPort" name="apPort" min="1" max="65535"></emc-input-number>
        </emc-form-field>
        <emc-form-field label="Slot name">
            <emc-input-string id="apSlotName" name="apSlotName"></emc-input-string>
        </emc-form-field>
        <emc-form-field label="Password">
            <emc-input-password id="apPassword" name="apPassword"></emc-input-password>
        </emc-form-field>
        <emc-form-field label="Sync Settings">
            <emc-input-switch id="apSettingsSync" name="apSettingsSync"></emc-input-switch>
        </emc-form-field>
    </form>
</emc-form-container>

<emc-button id="purge" class="button" variant="danger" text="Purge AP State"></emc-button>
<emc-button id="cancel" class="button" variant="secondary" text="Cancel"></emc-button>
<emc-button id="connect" class="button" variant="primary" text="Connect"></emc-button>
<emc-button id="disconnect" class="button" variant="primary" text="Disconnect" hidden></emc-button>
